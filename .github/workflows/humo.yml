name: humo

# macOS is validated on the Mac mini; GitHub-hosted macOS runners are not
# available for this private repository on its current plan.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: humo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humo:
    name: humo (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            triple: ""
            smoke: true
          - os: ubuntu-24.04
            target: windows-x86_64
            triple: x86_64-pc-windows-gnu
            smoke: false
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install the MinGW cross toolchain
        if: matrix.triple != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Add the Windows target
        if: matrix.triple != ''
        run: rustup target add "${{ matrix.triple }}"
      - name: Build lean release binary
        if: matrix.triple == ''
        working-directory: codex-rs
        run: cargo build --release --locked -p codex-cli --bin eslabon
      - name: Build lean Windows binary
        if: matrix.triple != ''
        working-directory: codex-rs
        run: cargo build --release --locked -p codex-cli --bin eslabon --target "${{ matrix.triple }}"
      - name: Run smoke harness
        if: matrix.smoke
        run: bash scripts/eslabon/humo/humo.sh codex-rs/target/release/eslabon
      - name: Verify Windows binary
        if: matrix.target == 'windows-x86_64'
        run: |
          file codex-rs/target/x86_64-pc-windows-gnu/release/eslabon.exe
          x86_64-w64-mingw32-objdump -p codex-rs/target/x86_64-pc-windows-gnu/release/eslabon.exe | grep -q 'PE32+'
